spring.application.name=MigrateCustomer

# Server Configuration
server.port=8081

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ace
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and HIBERNATE Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialectMySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=group_id_1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeseriliazer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeseriliazer
